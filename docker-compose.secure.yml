version: '3.8'

# This is an override file for production/secure deployments
# Usage: docker compose -f docker-compose.yml -f docker-compose.secure.yml up

services:
  # Update existing services with security hardening
  postgres:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID

  redis:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  redpanda:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  questdb:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Contestant sandbox service - this will run untrusted code
  contestant-sandbox-runtime:
    image: alpine:3.18
    entrypoint: /bin/sh
    command: -c "echo 'This is the gVisor installation target. Replace with your gVisor setup.'"
    profiles:
      - gvisor-setup
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Add isolated network for contestant services
  contestant-network:
    image: busybox:latest
    command: /bin/sh -c "trap : TERM INT; sleep infinity & wait"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    profiles:
      - network-setup

  # Template for contestant services (will be spun up dynamically in production)
  # To run this, ensure gVisor (runsc) is installed on your host:
  #   sudo apt-get update && sudo apt-get install -y runsc
  # And configured in /etc/docker/daemon.json.
  contestant-service-template:
    image: ${CONTESTANT_IMAGE:-contestant-default:latest}
    runtime: runsc  # Hardened sandbox using gVisor kernel isolation
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE  # Only allow network binding
    security_opt:
      - no-new-privileges:true
      - seccomp=unconfined  # Confined by gVisor instead of standard Docker seccomp
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    cpuset: "0"  # Pin to CPU 0
    pids_limit: 200
    read_only: true
    tmpfs:
      - /tmp:size=100m,noexec
      - /run:size=100m,noexec
    networks:
      - contestant-isolated
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  contestant-isolated:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
      com.docker.network.driver.mtu: 1500
    ipam:
      config:
        - subnet: 172.25.0.0/24  # Isolated subnet for contestant services
