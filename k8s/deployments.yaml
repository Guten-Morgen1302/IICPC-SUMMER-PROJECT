# ── build-runner ─────────────────────────────────────────────────────
# Needs Docker socket access to build contestant images
apiVersion: apps/v1
kind: Deployment
metadata:
  name: build-runner
  namespace: iicpc
  labels:
    app: build-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: build-runner
  template:
    metadata:
      labels:
        app: build-runner
    spec:
      containers:
        - name: build-runner
          image: iicpc/build-runner:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3002
          envFrom:
            - configMapRef:
                name: iicpc-config
            - secretRef:
                name: iicpc-secrets
          env:
            - name: PORT
              value: "3002"
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run/docker.sock
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
