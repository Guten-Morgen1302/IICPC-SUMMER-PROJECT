# ── ClusterIP Services for all platform microservices ────────────────
# Internal DNS: <service-name>.<namespace>.svc.cluster.local

# ── submission-api ───────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: submission-api-svc
  namespace: iicpc
  labels:
    app: submission-api
spec:
  type: NodePort          # publicly reachable for contestant uploads
  selector:
    app: submission-api
  ports:
    - name: http
      port: 3001
      targetPort: 3001
      nodePort: 30001
---
# ── build-runner ─────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: build-runner-svc
  namespace: iicpc
  labels:
    app: build-runner
spec:
  type: ClusterIP
  selector:
    app: build-runner
  ports:
    - name: http
      port: 3002
      targetPort: 3002
---
